---
- name: Resume deployment infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Gather information about any instance with a tag key Name and value Example
      amazon.aws.ec2_instance_info:
        region: "{{ infra_region }}"
        filters: "{{ dict(['tag:'] | product(asset_tags | dict2items | map(attribute='key')) | map('join') | zip(asset_values)) }}"
      vars:
        asset_values: "{{ asset_tags | dict2items | map(attribute='value') | list }}"
      register: __deployment

    - name: Resume the deployment instances
      amazon.aws.ec2_instance:
        region: "{{ infra_region }}"
        state: running
        instance_ids: "{{ __deployment.instances | map(attribute='instance_id') | list }}"

- name: Start the cluster services
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tasks:
    - name: Wait for the Cloudera Manager API
      cloudera.cluster.cm_version_info:
      register: __cm
      until: __cm is succeeded
      retries: 60
      delay: 15

    - name: Ensure the Cloudera Management Service is started
      cloudera.cluster.cm_service:
        state: started

    - name: Query the clusters
      cloudera.cluster.cluster_info:
        type: any
      register: __clusters

    - name: Ensure the base clusters are started
      cloudera.cluster.cluster:
        name: "{{ __cluster.name }}"
        state: started
      loop: "{{ __clusters.clusters | selectattr('cluster_type', 'eq', 'BASE_CLUSTER') | list }}"
      loop_control:
        loop_var: __cluster
        label: "{{ __cluster.name }}"

    - name: Wait for the Cloudera Management Service to be healthy
      cloudera.cluster.cm_service_info:
      register: __cms
      until: __cms.service.service_state == 'STARTED' and __cms.service.health_summary == 'GOOD'
      retries: 20
      delay: 30

    - name: Wait for the base clusters to be healthy
      cloudera.cluster.cluster_info:
        name: "{{ __cluster.name }}"
      loop: "{{ __clusters.clusters | selectattr('cluster_type', 'eq', 'BASE_CLUSTER') | list }}"
      loop_control:
        loop_var: __cluster
        label: "{{ __cluster.name }}"
      register: __health
      until: __health.clusters | map(attribute='entity_status') | first == 'GOOD_HEALTH'
      retries: 20
      delay: 30

    - name: Ensure the ECS clusters are started
      cloudera.cluster.cluster:
        name: "{{ __cluster.name }}"
        state: started
      loop: "{{ __clusters.clusters | selectattr('cluster_type', 'eq', 'EXPERIENCE_CLUSTER') | list }}"
      loop_control:
        loop_var: __cluster
        label: "{{ __cluster.name }}"

    - name: Wait for each ECS service to be started
      cloudera.cluster.service_info:
        cluster: "{{ __cluster.name }}"
      loop: "{{ __clusters.clusters | selectattr('cluster_type', 'eq', 'EXPERIENCE_CLUSTER') | list }}"
      loop_control:
        loop_var: __cluster
        label: "{{ __cluster.name }}"
      register: __ecs_services
      vars:
        ecs_services: "{{ __ecs_services.services | default([]) | selectattr('type', 'eq', 'ECS') | list }}"
      until: __ecs_services is succeeded and ecs_services | length == 1 and ecs_services[0].service_state == 'STARTED'
      retries: 40
      delay: 15

    - name: Unseal Vault on each ECS cluster
      cloudera.cluster.cm_resource:
        path: "/clusters/{{ __ecs_service.__cluster.name | urlencode }}/services/{{ ecs_service_name | urlencode }}/commands/VaultUnseal"
        method: POST
      loop: "{{ __ecs_services.results }}"
      loop_control:
        loop_var: __ecs_service
        label: "{{ __ecs_service.__cluster.name }}"
      vars:
        ecs_service_name: "{{ __ecs_service.services | selectattr('type', 'eq', 'ECS') | map(attribute='name') | first }}"
      register: __unseal

